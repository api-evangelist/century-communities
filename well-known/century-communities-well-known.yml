note: >-
  Century Communities runs its public site on Optimizely (formerly Episerver) CMS. The two
  documents that returned real bodies are the OpenID Connect / OAuth 2.0 authorization-server
  metadata that the Optimizely platform serves from the customer's own host — the issuer
  declares itself as https://www.centurycommunities.com/ and the endpoints it names are all
  under that host, so the deployment is Century Communities' even though the software is the
  vendor's. investors.centurycommunities.com answered HTTP 200 with an HTML Cloudflare
  interstitial for EVERY /.well-known/* path, including paths that cannot exist; that is a
  catch-all, not a document, and every path on that host is recorded as a miss.
