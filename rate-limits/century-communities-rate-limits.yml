specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Century Communities
providerId: century-communities
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: probed
modified: '2026-09-14'
reconciled: true
tags:
  - Real Estate
  - Homebuilding
  - Rate Limiting
description: >-
  Century Communities publishes no rate limits, and its one live API surface emits no
  runtime rate-limit signal. Re-checked 2026-09-14 by reading the response headers of the
  Optimizely Content Delivery API the company serves at
  https://www.centurycommunities.com/api/episerver/v3.0 — an honest zero, observed rather
  than assumed.
notes: >-
  The 2026-05-04 version of this file asserted a "Partner contract limit" and a backoff
  policy that nobody published; both were scaffold and have been removed. Cloudflare fronts
  the origin, so an undocumented edge limit may exist, but nothing the API returns tells a
  client what it is.
limit_count: 0
sources:
  - https://www.centurycommunities.com
  - https://www.centurycommunities.com/api/episerver/v3.0/site
observed:
  - url: https://www.centurycommunities.com/api/episerver/v3.0/site
    status: 200
    checked: '2026-09-14'
    rate_limit_headers: []
    retry_after: false
    note: >-
      Response headers were date, content-type, vary, cache-control, etag, set-cookie,
      strict-transport-security, request-context, x-frame-options, x-content-type-options,
      accept-ranges, cf-cache-status, cf-ray, alt-svc. No X-RateLimit-*, no RateLimit-*,
      no Retry-After.
responseCodes:
  throttled: null
limits: []
policies: []
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
