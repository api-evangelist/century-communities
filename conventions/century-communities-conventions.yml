source: >-
  Live unauthenticated requests to https://www.centurycommunities.com/api/episerver/v3.0/*
  and the OpenID Connect discovery document on the same host, 2026-09-14. Century
  Communities publishes no developer documentation, so no prose source exists to search;
  every statement below is an observed response or a value copied from a served document.
provider: Century Communities
providerId: century-communities
surface_summary: >-
  One machine-callable surface: the Optimizely (Episerver) Content Delivery API v3.0,
  mounted at https://www.centurycommunities.com/api/episerver/v3.0/. It is read-only to
  anonymous callers — POST and DELETE against the content collection both return 405 — and
  it serves the public site's own content tree. An OpenID Connect authorization server sits
  alongside it at /api/episerver/connect/* for clients Century Communities provisions
  privately.
authentication:
  anonymous_read: true
  style: OpenID Connect / OAuth 2.0 bearer for the authenticated surface
  detail: See authentication/century-communities-authentication.yml
  cross_reference: authentication/century-communities-authentication.yml
versioning:
  style: path-segment
  current: v3.0
  example: /api/episerver/v3.0/content
  note: >-
    v2.0 is not mounted on this deployment — /api/episerver/v2.0/content returns the CMS 404
    page. Only v3.0 answers.
  cross_reference: lifecycle/century-communities-lifecycle.yml
pagination:
  supported: false
  observed: >-
    GET /api/episerver/v3.0/content returns a bare JSON array with no envelope, no cursor,
    no total, and no Link header. The collection is filtered by query parameter
    (contentUrl, references) rather than paged.
  params: []
  response_fields: []
field_expansion:
  supported: true
  mechanism: >-
    The `expand` query parameter and the `references` parameter control how deeply
    contentLink references are inflated; observed in the shape of the returned payloads,
    where each contentLink carries an `expanded` member that is null unless requested.
metadata:
  supported: false
  note: No customer-supplied metadata surface; this is a content-read API.
request_id_tracing:
