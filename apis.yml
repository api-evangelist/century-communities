apis:
  - aid: century-communities:century-communities-content-delivery-api
    name: Century Communities Content Delivery API
    tags:
      - Content-Management
      - Real-Estate
      - Homebuilding
    tags_raw:
      - Content Management
      - Real Estate
      - Homebuilding
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://www.centurycommunities.com/api/episerver/v3.0
    humanURL: https://www.centurycommunities.com
    description: >-
      The Optimizely (Episerver) Content Delivery API v3.0 that Century Communities' public
      marketing site serves from its own host. It answers without credentials and returns
      the website's content tree — pages, blocks, assets, and a site definition carrying 60
      host bindings. Read-only: POST and DELETE to the content collection both return 405.
      Errors are RFC 9457 problem+json; responses carry ETags and honour If-None-Match with
      a 304. Century Communities publishes no documentation for it; the software is
      Optimizely's, the deployment, the data and the host are Century Communities'.
